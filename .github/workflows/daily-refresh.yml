name: 每日自动刷新国家队ETF报表

on:
  schedule:
    # 北京时间每天 07:52~09:37 每15分钟刷新，下午 16:07、晚间 23:07 兜底
    # 修改 cron 重新激活定时触发，避开整点和每刻钟的调度高峰
    # 数据未推进时 refresh.py 会沿用旧时间戳使输出字节不变, 工作流跳过提交(不产生冗余提交); 数据滞后时脚本会等待重试抓取
    # cron 为 UTC(北京=UTC+8); 星期字段只用 * (每天), 禁止用 7
    - cron: "52 23 * * *"    # 07:52 北京 每天
    - cron: "7 0 * * *"      # 08:07 北京 每天
    - cron: "22 0 * * *"     # 08:22 北京 每天
    - cron: "37 0 * * *"     # 08:37 北京 每天
    - cron: "52 0 * * *"     # 08:52 北京 每天
    - cron: "7 1 * * *"      # 09:07 北京 每天
    - cron: "22 1 * * *"     # 09:22 北京 每天
    - cron: "37 1 * * *"     # 09:37 北京 每天
    - cron: "7 8 * * *"      # 16:07 北京 每天
    - cron: "7 15 * * *"     # 23:07 北京 每天
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 份额历史缓存已纳入仓库(_etf_shares_cache.json), checkout即得完整5年基线;
      # refresh.py 每次增量拉取并写回, 下方提交阶段将更新后的缓存一并提交回推, 云端自持不依赖本地/actions-cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install akshare pandas requests

      - name: 运行刷新脚本(拉份额/净值/K线, 计算净买卖, 生成报表)
        run: python refresh.py

      - name: 将生成报表复制为 index.html 并提交(含份额缓存回写)
        run: |
          cp "国家队ETF每日净买入卖出报表.html" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _etf_shares_cache.json
          if git diff --cached --quiet; then
            echo "报表无变化, 跳过提交"
          else
            git commit -m "chore: 每日自动刷新国家队ETF净买卖报表 ($(date +%F\ %T) 北京+8)"
            git push
          fi
